<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle} ?: ${systemName}">Monitoring Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/portal.css}">
  <th:block th:fragment="extraHead"></th:block>
</head>
<body>
<div class="portal-shell" th:fragment="layout(activeMenu, content)">
  <!-- 상단 바: 시스템명 + 사용자 -->
  <header class="portal-topbar">
    <div class="portal-topbar-inner">
      <div class="portal-topbar-left">
        <button type="button" class="portal-hamburger" id="sidebarToggle" aria-label="메뉴 열기">☰</button>
        <h1 class="portal-brand" th:text="${systemName}">Monitoring Portal</h1>
      </div>
      <div class="portal-user">
        <span class="portal-user-icon">👤</span>
        <span class="portal-user-name" th:text="${currentUser}">Guest</span>
      </div>
    </div>
  </header>

  <div class="portal-body">
    <div class="portal-sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
    <aside class="portal-sidebar" id="sidebar">
      <nav class="portal-nav">
        <a class="portal-nav-item" th:classappend="${activeMenu}=='home' ? ' active' : ''" th:href="@{/}">
          🏠 Home
        </a>
        <a class="portal-nav-item" th:classappend="${activeMenu}=='servers' ? ' active' : ''" th:href="@{/servers}">
          🖥️ Servers
        </a>
        <a class="portal-nav-item" th:classappend="${activeMenu}=='rules' ? ' active' : ''" th:href="@{/rules}">
          🔔 Alert Rules
        </a>
        <a class="portal-nav-item" th:classappend="${activeMenu}=='recipients' ? ' active' : ''" th:href="@{/recipients}">
          👥 Alert Recipients
        </a>
        <a class="portal-nav-item" th:classappend="${activeMenu}=='checkRuns' ? ' active' : ''" th:href="@{/check-runs}">
          📋 Check Center
        </a>
        <a class="portal-nav-item" th:classappend="${activeMenu}=='outbox' ? ' active' : ''" th:href="@{/outbox}">
          📤 Notification Center
        </a>
        <div class="portal-nav-divider"></div>
        <div class="portal-nav-group">System Management</div>
        <a class="portal-nav-item" th:classappend="${activeMenu}=='settings' ? ' active' : ''" th:href="@{/settings}">
          ⚙️ Settings
        </a>
      </nav>
      <div class="portal-sidebar-footer">
        <div class="small text-white-50">© Monitoring System</div>
        <div class="small text-white-50" th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm')}">--</div>
      </div>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="portal-main">
      <div class="portal-content">
        <div th:replace="__${content}__">CONTENT</div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  var toggle = document.getElementById('sidebarToggle');
  function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); overlay.setAttribute('aria-hidden','false'); document.body.classList.add('sidebar-open'); }
  function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); overlay.setAttribute('aria-hidden','true'); document.body.classList.remove('sidebar-open'); }
  function isOpen(){ return sidebar && sidebar.classList.contains('open'); }
  toggle && toggle.addEventListener('click', function(){ isOpen() ? closeSidebar() : openSidebar(); });
  overlay && overlay.addEventListener('click', closeSidebar);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && isOpen()) closeSidebar(); });
  window.matchMedia('(min-width:992px)').addEventListener('change', function(m){ if (m.matches) closeSidebar(); });
})();
</script>
<th:block th:fragment="extraScript"></th:block>
</body>
</html>
