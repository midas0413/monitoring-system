<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>서버</h2>
    <a th:href="@{/servers/new}" class="btn btn-primary">서버 등록</a>
  </div>

  <!-- 검색 -->
  <form method="get" action="/servers" class="mb-3">
    <div class="input-group">
      <input type="text" name="q" th:value="${q}" class="form-control" placeholder="서버명 또는 호스트로 검색...">
      <button type="submit" class="btn btn-outline-secondary">검색</button>
      <a th:href="@{/servers}" class="btn btn-outline-secondary">초기화</a>
    </div>
  </form>

  <!-- 메시지 -->
  <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- 서버 목록 -->
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>서버명</th>
          <th>호스트</th>
          <th>타임존</th>
          <th>용도</th>
          <th>VPN</th>
          <th>상태</th>
          <th>작업</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${items}">
          <td th:text="${item.id}"></td>
          <td>
            <a th:href="@{/servers/{id}/edit(id=${item.id})}" th:text="${item.name}"></a>
          </td>
          <td th:text="${item.host}"></td>
          <td th:text="${item.timezone}"></td>
          <td>
            <span class="badge bg-secondary" th:text="${item.serverPurpose}"></span>
          </td>
          <td th:text="${vpnDisplay.get(item.id)} ?: '-'"></td>
          <td>
            <span th:if="${item.enabled}" class="badge bg-success">활성</span>
            <span th:unless="${item.enabled}" class="badge bg-secondary">비활성</span>
          </td>
          <td>
            <a th:href="@{/servers/{id}/edit(id=${item.id})}" class="btn btn-sm btn-outline-primary">수정</a>
            <form th:action="@{/servers/{id}/delete(id=${item.id})}" method="post" style="display: inline;" 
                  onsubmit="return confirm('이 서버를 삭제하시겠습니까?');">
              <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
            </form>
          </td>
        </tr>
        <tr th:if="${items == null || #lists.isEmpty(items)}">
          <td colspan="8" class="text-center text-muted py-4">해당 데이터가 없습니다</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
