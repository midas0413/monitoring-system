<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="content">
    <div class="container-fluid">

        <div class="page-header mb-3">
            <h5 th:text="${id == null} ? 'New Recipient' : 'Edit Recipient'">Form</h5>
            <div class="page-header-actions">
              <a class="btn btn-outline-secondary" th:href="@{/recipients}">Back</a>
            </div>
        </div>

        <div class="card card-shadow">
            <div class="card-body">

                <form method="post"
                      th:action="${id == null} ? @{/recipients/new} : @{/recipients/{id}/edit(id=${id})}"
                      th:object="${form}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Name</label>
                            <input class="form-control" th:field="*{name}" placeholder="ex) On-call A">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Enabled</label>
                            <div class="d-flex gap-3 pt-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="enabled" id="recipEnabledOn" th:value="true" th:field="*{enabled}">
                                    <label class="form-check-label" for="recipEnabledOn">ON</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="enabled" id="recipEnabledOff" th:value="false" th:field="*{enabled}">
                                    <label class="form-check-label" for="recipEnabledOff">OFF</label>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Channels</label>
                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="SMS"
                                           th:field="*{channelList}">
                                    <label class="form-check-label">SMS</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="EMAIL"
                                           th:field="*{channelList}">
                                    <label class="form-check-label">EMAIL</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="KAKAO"
                                           th:field="*{channelList}">
                                    <label class="form-check-label">KAKAO</label>
                                </div>
                            </div>
                            <div class="form-text">선택한 채널은 DB의 channels 컬럼(CSV)로 저장됩니다.</div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Phone</label>
                            <input class="form-control" th:field="*{phone}" placeholder="010-0000-0000">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Email</label>
                            <input class="form-control" th:field="*{email}" placeholder="user@example.com">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Kakao</label>
                            <input class="form-control" th:field="*{kakao}" placeholder="kakao channel id">
                        </div>

                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button class="btn btn-primary" type="submit">Save</button>
                        <a class="btn btn-outline-secondary" th:href="@{/recipients}">Cancel</a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</section>
</body>
</html>
