<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div class="container-fluid">

    <div class="page-header mb-3">
      <div>
        <h5 class="mb-0">Rule Recipients</h5>
        <div class="text-muted small">Rule: <strong th:text="${rule.name}">rule</strong> (ID=<span th:text="${rule.id}">1</span>)</div>
      </div>
      <div class="page-header-actions d-flex gap-2">
        <a class="btn btn-outline-secondary" th:href="@{/monitoring-rules/{id}/edit(id=${rule.id})}">Back</a>
        <a class="btn btn-primary" th:href="@{/recipients/new}">+ New Recipient</a>
      </div>
    </div>

    <!-- 메시지 -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${message}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card card-shadow">
      <div class="card-body">
        <form th:action="@{/monitoring-rules/{id}/recipients(id=${rule.id})}" method="post">
          <div class="text-muted small mb-3">체크된 recipient들이 이 rule에 연결됩니다. (recipient의 channels/phone/email/kakao 사용)</div>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
              <tr>
                <th style="width:50px">Use</th>
                <th style="width:70px">ID</th>
                <th>Name</th>
                <th style="width:90px">Enabled</th>
                <th>Channels</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Kakao</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="r : ${recipients}">
                <td>
                  <input class="form-check-input" type="checkbox" name="recipientIds"
                         th:value="${r.id}" th:checked="${linkedIds.contains(r.id)}">
                </td>
                <td th:text="${r.id}">1</td>
                <td class="fw-semibold" th:text="${r.name}">name</td>
                <td>
                  <span class="badge rounded-pill"
                        th:classappend="${r.enabled} ? ' text-bg-success' : ' text-bg-secondary'"
                        th:text="${r.enabled} ? 'ON' : 'OFF'">ON</span>
                </td>
                <td><span class="badge rounded-pill badge-soft" th:text="${r.channels}">SMS,EMAIL</span></td>
                <td th:text="${r.phone} ?: '-'">-</td>
                <td th:text="${r.email} ?: '-'">-</td>
                <td th:text="${r.kakao} ?: '-'">-</td>
              </tr>
              <tr th:if="${recipients == null || #lists.isEmpty(recipients)}">
                <td colspan="8" class="text-center text-muted py-4">recipient가 없습니다. 먼저 등록하세요.</td>
              </tr>
              </tbody>
            </table>
          </div>

          <div class="mt-3 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save Links</button>
            <a class="btn btn-outline-secondary" th:href="@{/monitoring-rules}">Cancel</a>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
</body>
</html>
