<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>알림 규칙</h2>
    <a th:href="@{/rules/new}" class="btn btn-primary">규칙 등록</a>
  </div>

  <!-- 검색 -->
  <form method="get" action="/monitoring-rules" class="mb-3">
    <div class="input-group">
      <input type="text" name="q" th:value="${q}" class="form-control" placeholder="규칙명으로 검색...">
      <button type="submit" class="btn btn-outline-secondary">검색</button>
      <a th:href="@{/rules}" class="btn btn-outline-secondary">초기화</a>
    </div>
  </form>

  <!-- 메시지 -->
  <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- 룰 목록 -->
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>규칙명</th>
          <th>서버</th>
          <th>유형</th>
          <th>연산자</th>
          <th>상태</th>
          <th>주기</th>
          <th>작업</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${items}">
          <td th:text="${item.id}"></td>
          <td>
            <a th:href="@{/monitoring-rules/{id}/edit(id=${item.id})}" th:text="${item.name}"></a>
          </td>
          <td th:text="${serverDisplay.get(item.id)} ?: '-'"></td>
          <td>
            <span class="badge bg-info" th:text="${item.monitoringType}"></span>
          </td>
          <td>
            <span class="badge bg-secondary" th:text="${item.alertOperator}"></span>
          </td>
          <td>
            <span th:if="${item.enabled}" class="badge bg-success">활성</span>
            <span th:unless="${item.enabled}" class="badge bg-secondary">비활성</span>
          </td>
          <td th:text="${item.intervalSec} + ' sec'"></td>
          <td>
            <a th:href="@{/rules/{id}/edit(id=${item.id})}" class="btn btn-sm btn-outline-primary">수정</a>
            <a th:href="@{/rules/{id}/recipients(id=${item.id})}" class="btn btn-sm btn-outline-info">
              수신자
              <span th:if="${recipientCountMap != null && recipientCountMap.containsKey(item.id) && recipientCountMap.get(item.id) > 0}" 
                    class="badge bg-primary ms-1" th:text="${recipientCountMap.get(item.id)}">0</span>
            </a>
            <form th:action="@{/rules/{id}/delete(id=${item.id})}" method="post" style="display: inline;" 
                  onsubmit="return confirm('이 규칙을 삭제하시겠습니까?');">
              <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
            </form>
          </td>
        </tr>
        <tr th:if="${items == null || #lists.isEmpty(items)}">
          <td colspan="8" class="text-center text-muted py-4">해당 데이터가 없습니다</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
