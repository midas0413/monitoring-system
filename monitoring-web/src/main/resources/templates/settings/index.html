<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>시스템 설정</h2>
  </div>

  <!-- 메시지 -->
  <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="row g-4">
    <!-- Notification Settings -->
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">📧 알림 설정</h5>
          <p class="card-text text-muted">알림 제공자 설정 관리 (Aligo, SMTP 등)</p>
          <a th:href="@{/settings/notification}" class="btn btn-primary">관리</a>
        </div>
      </div>
    </div>

    <!-- System Codes -->
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">📋 시스템 코드</h5>
          <p class="card-text text-muted">시스템 코드 테이블 관리 (모니터링 유형, 알림 연산자 등)</p>
          <a th:href="@{/settings/system-codes}" class="btn btn-primary">관리</a>
        </div>
      </div>
    </div>

    <!-- VPN Connections -->
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">🔐 VPN 연결</h5>
          <p class="card-text text-muted">VPN 연결 정보 및 상태 관리</p>
          <a th:href="@{/vpn}" class="btn btn-primary">관리</a>
        </div>
      </div>
    </div>

    <!-- Timezone Codes -->
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">🌍 타임존 코드</h5>
          <p class="card-text text-muted">타임존 정보 조회 및 관리</p>
          <a th:href="@{/timezones}" class="btn btn-primary">조회</a>
        </div>
      </div>
    </div>
  </div>
</div>
