<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Notification Settings</h2>
    <a th:href="@{/settings/notification/new}" class="btn btn-primary">New Setting</a>
  </div>

  <!-- 검색 -->
  <form method="get" action="/settings/notification" class="mb-3">
    <div class="input-group">
      <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Search by name or provider...">
      <button type="submit" class="btn btn-outline-secondary">Search</button>
      <a th:href="@{/settings/notification}" class="btn btn-outline-secondary">Clear</a>
    </div>
  </form>

  <!-- 메시지 -->
  <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- 설정 목록 -->
  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Provider</th>
          <th>Enabled</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${items}">
          <td th:text="${item.id}"></td>
          <td>
            <a th:href="@{/settings/notification/{id}/edit(id=${item.id})}" th:text="${item.name}"></a>
          </td>
          <td>
            <span class="badge bg-info" th:text="${item.provider}"></span>
          </td>
          <td>
            <span th:if="${item.enabled}" class="badge bg-success">Enabled</span>
            <span th:unless="${item.enabled}" class="badge bg-secondary">Disabled</span>
          </td>
          <td th:text="${item.description} ?: '-'"></td>
          <td>
            <a th:href="@{/settings/notification/{id}/edit(id=${item.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
            <form th:action="@{/settings/notification/{id}/delete(id=${item.id})}" method="post" style="display: inline;" 
                  onsubmit="return confirm('Are you sure you want to delete this setting?');">
              <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
          </td>
        </tr>
        <tr th:if="${items == null || #lists.isEmpty(items)}">
          <td colspan="6" class="text-center text-muted py-4">해당 데이터가 없습니다</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
