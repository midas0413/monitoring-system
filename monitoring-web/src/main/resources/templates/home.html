<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><title>CNIT 모니터링시스템</title></head>
<body>
<section th:fragment="content">
  <div class="container-fluid">

    <div class="page-header mb-4">
      <div>
        <h5 class="mb-1">모니터링 대시보드</h5>
        <div class="text-muted small">서버별 모니터링 상태 및 알림 현황</div>
      </div>
    </div>

    <!-- 1. VPN 연결 상태 카드 (상단) -->
    <div class="row g-3 mb-4" th:if="${vpns != null && !vpns.isEmpty()}">
      <div class="col-12">
        <h6 class="mb-2">VPN 연결 상태</h6>
      </div>
      <div class="col-12 col-sm-6 col-md-4" th:each="vpn : ${vpns}">
        <div class="card card-shadow h-100" th:attr="data-vpn-id=${vpn.id}">
          <div class="card-header d-flex justify-content-between align-items-center py-2">
            <span class="fw-bold" th:text="${vpn.name}">VPN Name</span>
            <span class="badge rounded-pill vpn-status-badge" 
                  th:classappend="${vpn.status == T(com.example.monitoring.common.domain.ServerStatus).UP} ? ' text-bg-success' : 
                                  (${vpn.status == T(com.example.monitoring.common.domain.ServerStatus).DOWN} ? ' text-bg-danger' : ' text-bg-secondary')"
                  th:text="${vpn.status}">UNKNOWN</span>
          </div>
          <div class="card-body py-2">
            <div class="small">
              <div class="mb-1"><strong>VPN TEST IP:</strong> <span th:text="${vpn.host}">-</span></div>
              <div class="mb-1" th:if="${vpn.lastCheckedAt != null}">
                <strong>마지막 확인:</strong> <span class="vpn-last-checked" th:text="${#temporals.format(vpn.lastCheckedAt, 'yyyy-MM-dd HH:mm:ss')}">-</span>
              </div>
              <div th:if="${vpn.lastStatusChangeAt != null}">
                <strong>상태 변경:</strong> <span th:text="${#temporals.format(vpn.lastStatusChangeAt, 'yyyy-MM-dd HH:mm:ss')}">-</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 서버별 모니터링 카드 -->
    <div class="row g-3 mb-4">
      <div class="col-12">
        <h6 class="mb-2">서버별 모니터링</h6>
      </div>
      <div class="col-12 col-sm-6 col-md-4" th:each="server : ${servers}">
        <div class="card card-shadow h-100">
          <div class="card-header d-flex justify-content-between align-items-center py-2">
            <div>
              <span class="fw-bold" th:text="${server.name}">Server Name</span>
              <span class="badge rounded-pill ms-2" 
                    th:classappend="${serverStatusMap != null && serverStatusMap.get(server.id) == T(com.example.monitoring.common.domain.ServerStatus).UP} ? ' text-bg-success' : 
                                    (${serverStatusMap != null && serverStatusMap.get(server.id) == T(com.example.monitoring.common.domain.ServerStatus).DOWN} ? ' text-bg-danger' : ' text-bg-secondary')"
                    th:text="${serverStatusMap != null && serverStatusMap.get(server.id) != null ? serverStatusMap.get(server.id) : 'UNKNOWN'}">UNKNOWN</span>
            </div>
          </div>
          <div class="card-body py-2">
            <div class="small mb-2">
              <div class="mb-1"><strong>호스트:</strong> <span th:text="${server.host}">-</span></div>
              <div class="mb-1"><strong>용도:</strong> <span th:text="${server.serverPurpose}">-</span></div>
              <div><strong>타임존:</strong> <span th:text="${server.timezone}">-</span></div>
            </div>
            <div class="border-top pt-2 mt-2">
              <div class="small fw-semibold mb-1">Monitoring Rules</div>
              <ul class="list-unstyled small mb-0">
                <li class="d-flex justify-content-between align-items-center py-1 border-bottom" 
                    th:each="rule : ${rulesByServer != null ? rulesByServer.get(server.id) : null}">
                  <span th:text="${rule.name}">rule</span>
                  <span class="badge bg-primary" 
                        th:text="${notificationCountByRule != null && notificationCountByRule.get(rule.id) != null ? notificationCountByRule.get(rule.id) : 0} + '건'">0건</span>
                </li>
                <li class="text-muted py-1" 
                    th:if="${rulesByServer == null || rulesByServer.get(server.id) == null || rulesByServer.get(server.id).isEmpty()}">
                  해당 데이터가 없습니다
                </li>
              </ul>
            </div>
          </div>
          <div class="card-footer py-2">
            <a class="btn btn-outline-primary btn-sm" th:href="@{/monitoring-rules/new}">+ New Rule</a>
          </div>
        </div>
      </div>
      <div class="col-12" th:if="${servers == null || servers.isEmpty()}">
        <div class="alert alert-info mb-0">등록된 서버가 없습니다. <a th:href="@{/servers/new}">서버를 등록</a>하세요.</div>
      </div>
    </div>

    <!-- 2. Check Results 목록 (체크 실행 내역 include) -->
    <div th:replace="checkruns/list :: content"></div>

  </div>
</section>

<script th:inline="javascript">
(function() {
  const REFRESH_INTERVAL = 30000; // 30초
  const checkId = /*[[${filterCheckId}]]*/ null;
  
  function formatDateTime(dateTimeStr) {
    if (!dateTimeStr) return '-';
    try {
      const dt = new Date(dateTimeStr);
      const year = dt.getFullYear();
      const month = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      const hours = String(dt.getHours()).padStart(2, '0');
      const minutes = String(dt.getMinutes()).padStart(2, '0');
      const seconds = String(dt.getSeconds()).padStart(2, '0');
      return year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
    } catch (e) {
      return dateTimeStr;
    }
  }
  
  function abbreviate(str, maxLen) {
    if (!str) return '';
    return str.length > maxLen ? str.substring(0, maxLen) + '...' : str;
  }
  
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  function updateNotificationCounts(notificationCountByCheck) {
    if (!notificationCountByCheck) return;
    
    document.querySelectorAll('.notification-badge').forEach(function(badge) {
      const checkIdStr = badge.getAttribute('data-check-id');
      if (checkIdStr) {
        const checkIdNum = parseInt(checkIdStr, 10);
        // JSON에서 Long은 문자열 키로 변환될 수 있으므로 두 가지 모두 시도
        const count = notificationCountByCheck[checkIdNum] !== undefined 
            ? notificationCountByCheck[checkIdNum] 
            : (notificationCountByCheck[checkIdStr] !== undefined ? notificationCountByCheck[checkIdStr] : 0);
        badge.textContent = '알림 ' + count + '건';
      }
    });
  }
  
  function updateServerStatusIndicators(serverStatusByTarget) {
    if (!serverStatusByTarget) return;
    
    document.querySelectorAll('.server-status-indicator').forEach(function(indicator) {
      const targetName = indicator.getAttribute('data-target-name');
      if (targetName && serverStatusByTarget[targetName]) {
        const status = serverStatusByTarget[targetName];
        const dot = indicator.querySelector('.status-dot');
        if (dot) {
          if (status === 'UP') {
            dot.style.backgroundColor = '#28a745'; // 녹색
          } else if (status === 'DOWN') {
            dot.style.backgroundColor = '#dc3545'; // 레드
          } else {
            dot.style.backgroundColor = '#6c757d'; // 회색 (UNKNOWN)
          }
        }
      }
    });
  }
  
  function updateCheckRunsTable(checkRuns, startedDisplay, ruleNameDisplay, serverDisplay) {
    const tbody = document.getElementById('checkRunsTableBody');
    if (!tbody) return;
    
    if (!checkRuns || checkRuns.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-3">해당 데이터가 없습니다</td></tr>';
      return;
    }
    
    let html = '';
    checkRuns.forEach(function(run) {
      const ruleName = (ruleNameDisplay && run.checkId && ruleNameDisplay[run.checkId]) ? ruleNameDisplay[run.checkId] : '-';
      const serverName = (serverDisplay && run.checkId && serverDisplay[run.checkId]) ? serverDisplay[run.checkId] : '-';
      const started = (startedDisplay && startedDisplay[run.id]) ? startedDisplay[run.id] : formatDateTime(run.startedAt);
      const successClass = run.success ? 'text-bg-success' : 'text-bg-danger';
      const successText = run.success ? 'OK' : 'FAIL';
      const duration = (run.durationMs != null) ? run.durationMs + ' ms' : '-';
      
      let outputHtml = '-';
      if (run.errorMessage) {
        outputHtml = '<span class="text-danger">' + escapeHtml(abbreviate(run.errorMessage, 80)) + '</span>';
      } else if (run.output) {
        outputHtml = '<span class="text-muted">' + escapeHtml(abbreviate(run.output, 80)) + '</span>';
      }
      
      html += '<tr>' +
        '<td>' + escapeHtml(String(run.id || '')) + '</td>' +
        '<td>' + escapeHtml(ruleName) + '</td>' +
        '<td>' + escapeHtml(serverName) + '</td>' +
        '<td><span class="badge rounded-pill ' + successClass + '">' + successText + '</span></td>' +
        '<td class="small">' + escapeHtml(started) + '</td>' +
        '<td>' + escapeHtml(duration) + '</td>' +
        '<td class="small text-break" style="max-width:300px">' + outputHtml + '</td>' +
        '</tr>';
    });
    
    tbody.innerHTML = html;
  }
  
  function updateVpnStatus(vpns, vpnStatusMap) {
    if (!vpns || !vpnStatusMap) return;
    
    vpns.forEach(function(vpn) {
      const vpnCard = document.querySelector('[data-vpn-id="' + vpn.id + '"]');
      if (!vpnCard) return;
      
      const status = vpnStatusMap[vpn.id] || 'UNKNOWN';
      const badge = vpnCard.querySelector('.vpn-status-badge');
      if (badge) {
        badge.textContent = status;
        badge.className = 'badge rounded-pill';
        if (status === 'UP') {
          badge.classList.add('text-bg-success');
        } else if (status === 'DOWN') {
          badge.classList.add('text-bg-danger');
        } else {
          badge.classList.add('text-bg-secondary');
        }
      }
      
      // 마지막 확인 시간 업데이트
      if (vpn.lastCheckedAt) {
        const lastCheckedEl = vpnCard.querySelector('.vpn-last-checked');
        if (lastCheckedEl) {
          lastCheckedEl.textContent = formatDateTime(vpn.lastCheckedAt);
        }
      }
    });
  }
  
  function refreshData() {
    const url = '/api/home/refresh' + (checkId ? '?checkId=' + checkId : '');
    const refreshTime = new Date().toLocaleTimeString('ko-KR');
    console.log('[' + refreshTime + '] Home 화면 리프레시 시작');
    
    fetch(url)
      .then(function(response) {
        if (!response.ok) {
          throw new Error('Network response was not ok: ' + response.status);
        }
        return response.json();
      })
      .then(function(data) {
        console.log('[' + new Date().toLocaleTimeString('ko-KR') + '] Home 화면 리프레시 완료');
        if (data.notificationCountByCheck) {
          updateNotificationCounts(data.notificationCountByCheck);
        }
        if (data.serverStatusByTarget) {
          updateServerStatusIndicators(data.serverStatusByTarget);
        }
        if (data.checkRuns) {
          updateCheckRunsTable(data.checkRuns, data.startedDisplay || {}, data.ruleNameDisplay || {}, data.serverDisplay || {});
        }
        if (data.vpns && data.vpnStatusMap) {
          updateVpnStatus(data.vpns, data.vpnStatusMap);
        }
      })
      .catch(function(error) {
        console.error('[' + new Date().toLocaleTimeString('ko-KR') + '] Refresh failed:', error);
      });
  }
  
  // 30초 간격으로 자동 리프레시
  setInterval(refreshData, REFRESH_INTERVAL);
  
  // 초기 로드 시 서버 상태 표시
  const initialServerStatus = /*[[${serverStatusByTarget}]]*/ {};
  if (initialServerStatus) {
    updateServerStatusIndicators(initialServerStatus);
  }
  
  // 페이지 로드 후 5초 후 첫 리프레시 (초기 로드와 겹치지 않도록)
  setTimeout(refreshData, 5000);
  
  // 리프레시 상태 표시 (디버깅용)
  console.log('Home 화면 자동 리프레시 시작: ' + REFRESH_INTERVAL / 1000 + '초 간격');
})();
</script>
</body>
</html>
