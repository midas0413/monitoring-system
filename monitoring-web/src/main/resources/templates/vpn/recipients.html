<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
  <div class="container-fluid">

    <div class="page-header mb-3">
      <div>
        <h5 class="mb-0">VPN 수신자 연결</h5>
        <div class="text-muted small">VPN: <strong th:text="${vpn.name}">vpn</strong> (ID=<span th:text="${vpn.id}">1</span>) — 연결된 수신자에게만 VPN 상태 변경 알림이 발송됩니다.</div>
      </div>
      <div class="page-header-actions d-flex gap-2">
        <a class="btn btn-outline-secondary" th:href="@{/vpn}">목록으로</a>
        <a class="btn btn-primary" th:href="@{/recipients/new}">+ 수신자 등록</a>
      </div>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${message}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card card-shadow">
      <div class="card-body">
        <form th:action="@{/vpn/{id}/recipients(id=${vpn.id})}" method="post">
          <div class="text-muted small mb-3">체크된 수신자에게만 이 VPN의 상태 변경 알림이 발송됩니다. (수신자 채널/연락처 사용)</div>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
              <tr>
                <th style="width:50px">연결</th>
                <th style="width:70px">ID</th>
                <th>이름</th>
                <th style="width:90px">활성</th>
                <th>채널</th>
                <th>전화</th>
                <th>이메일</th>
                <th>카카오</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="r : ${recipients}">
                <td>
                  <input class="form-check-input" type="checkbox" name="recipientIds"
                         th:value="${r.id}" th:checked="${linkedIds.contains(r.id)}">
                </td>
                <td th:text="${r.id}">1</td>
                <td class="fw-semibold" th:text="${r.name}">name</td>
                <td>
                  <span class="badge rounded-pill"
                        th:classappend="${r.enabled} ? ' text-bg-success' : ' text-bg-secondary'"
                        th:text="${r.enabled} ? 'ON' : 'OFF'">ON</span>
                </td>
                <td><span class="badge rounded-pill badge-soft" th:text="${r.channels}">SMS,EMAIL</span></td>
                <td th:text="${r.phone} ?: '-'">-</td>
                <td th:text="${r.email} ?: '-'">-</td>
                <td th:text="${r.kakao} ?: '-'">-</td>
              </tr>
              <tr th:if="${recipients == null || #lists.isEmpty(recipients)}">
                <td colspan="8" class="text-center text-muted py-4">수신자가 없습니다. 먼저 수신자를 등록하세요.</td>
              </tr>
              </tbody>
            </table>
          </div>

          <div class="mt-3 d-flex gap-2">
            <button class="btn btn-primary" type="submit">연결 저장</button>
            <a class="btn btn-outline-secondary" th:href="@{/vpn}">취소</a>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
</body>
</html>
