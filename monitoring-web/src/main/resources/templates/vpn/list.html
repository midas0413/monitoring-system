<div th:fragment="content">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>VPN Connections</h2>
    <a th:href="@{/vpn/new}" class="btn btn-primary">+ New VPN Connection</a>
  </div>

  <!-- 메시지 -->
  <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <form class="row g-2 mb-3" method="get" th:action="@{/vpn}">
    <div class="col-sm-8 col-md-6">
      <input class="form-control" name="q" th:value="${q}" placeholder="Search by name or host...">
    </div>
    <div class="col-auto">
      <button class="btn btn-outline-secondary" type="submit">Search</button>
    </div>
    <div class="col-auto" th:if="${q != null && !#strings.isEmpty(q)}">
      <a class="btn btn-link" th:href="@{/vpn}">Clear</a>
    </div>
  </form>

  <div class="card card-shadow">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>VPN TEST IP</th>
              <th>체크 주기</th>
              <th>Status</th>
              <th>마지막 체크</th>
              <th>Enabled</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${items == null || #lists.isEmpty(items)}">
              <td colspan="9" class="text-center text-muted">No VPN connections found</td>
            </tr>
            <tr th:each="item : ${items}">
              <td th:text="${item.id}"></td>
              <td th:text="${item.name}"></td>
              <td th:text="${item.host}"></td>
              <td>
                <span class="badge bg-info" th:text="${item.checkIntervalSec} + '초'"></span>
              </td>
              <td>
                <span class="badge" 
                      th:classappend="${item.status.name() == 'UP'} ? 'bg-success' : 
                                     (${item.status.name() == 'DOWN'} ? 'bg-danger' : 'bg-secondary')"
                      th:text="${item.status.name()}"></span>
              </td>
              <td class="small">
                <div th:if="${item.lastCheckedAt != null}">
                  <div th:text="${#temporals.format(item.lastCheckedAt, 'yyyy-MM-dd HH:mm:ss')}"></div>
                </div>
                <div class="text-muted" th:if="${item.lastCheckedAt == null}">아직 체크되지 않음</div>
              </td>
              <td>
                <span class="badge" 
                      th:classappend="${item.enabled} ? 'bg-success' : 'bg-secondary'"
                      th:text="${item.enabled} ? 'Enabled' : 'Disabled'"></span>
              </td>
              <td th:text="${item.description} ?: '-'"></td>
              <td>
                <a th:href="@{/vpn/{id}/edit(id=${item.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                <form th:action="@{/vpn/{id}/delete(id=${item.id})}" method="post" style="display: inline;" 
                      onsubmit="return confirm('Are you sure you want to delete this VPN connection?');">
                  <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
