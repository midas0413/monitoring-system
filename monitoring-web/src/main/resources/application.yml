server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

app:
  system-name: ${APP_SYSTEM_NAME:Monitoring Portal}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
    org.thymeleaf: ${LOGGING_LEVEL_ORG_THYMELEAF:INFO}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://172.22.1.113:5432/monitoring}
    username: ${SPRING_DATASOURCE_USERNAME:monitoring}
    password: ${SPRING_DATASOURCE_PASSWORD:monitoring}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true

  flyway:
    locations: classpath:db/migration
    repair-on-migrate: true  # 마이그레이션 파일 변경 시 체크섬 자동 수정
    baseline-on-migrate: true  # 기존 스키마가 있을 때 baseline 설정
    validate-on-migrate: false  # 마이그레이션 파일 변경 시 체크섬 불일치 허용

    logging:
      level:
        org.flywaydb: DEBUG
        org.springframework.boot.autoconfigure.flyway: DEBUG