server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

app:
  system-name: ${APP_SYSTEM_NAME:CNIT 모니터링시스템}

# Worker API 설정
worker:
  api:
    base-url: ${WORKER_API_BASE_URL:http://172.22.2.13:8081}  # 다른 서버 배포 시: http://worker-server-ip:8081
    enabled: ${WORKER_API_ENABLED:true}  # true: Worker API 사용, false: Web에서 직접 실행
    api-key: ${WORKER_API_KEY:}  # Worker API 인증 키 (선택, 보안을 위해 설정 권장)
    timeout-ms: ${WORKER_API_TIMEOUT_MS:30000}  # API 호출 읽기 타임아웃 (밀리초). SQL/SSH 테스트 시 30초 권장

# Aligo API (카카오 알림톡/LMS)
# 알리고: https://smartsms.aligo.in
aligo:
  api-key: ${ALIGO_API_KEY:ou73by0iwvi33psmwrgvsjgvxtsc8t7f}
  user-id: ${ALIGO_USER_ID:midas09}
  sender: ${ALIGO_SENDER:02-736-3500}           # 발신번호 (사이트에 등록된 번호)
  sender-key: ${ALIGO_SENDER_KEY:fab6a2937b472d39f03bb3ca2873bd331ce3a7af}   # 알림톡용 (카카오 채널 발신프로필 키)
  template-code: ${ALIGO_TEMPLATE_CODE:UC_2669}  # 알림톡 템플릿 코드 (선택, 없으면 LMS로 발송)
  test-mode: ${ALIGO_TEST_MODE:N}    # Y: 테스트(실제 전송 안함), N: 실제 전송

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
    org.thymeleaf: ${LOGGING_LEVEL_ORG_THYMELEAF:INFO}

spring:
  datasource:
    # 로컬 bootRun 시: DB가 접근 가능한 URL로 설정 (예: localhost 또는 SPRING_DATASOURCE_URL 환경변수)
    # 예: set SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/monitoring
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://172.22.1.113:5432/monitoring}
    username: ${SPRING_DATASOURCE_USERNAME:monitoring}
    password: ${SPRING_DATASOURCE_PASSWORD:monitoring}
    hikari:
      connection-timeout: 20000   # 20초 (연결 대기)
      initialization-fail-timeout: -1  # -1: 연결 실패 시 즉시 종료 (기본)
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true

  flyway:
    locations: classpath:db/migration
    repair-on-migrate: true  # 마이그레이션 파일 변경 시 체크섬 자동 수정
    baseline-on-migrate: true  # 기존 스키마가 있을 때 baseline 설정
    validate-on-migrate: false  # 마이그레이션 파일 변경 시 체크섬 불일치 허용

    logging:
      level:
        org.flywaydb: DEBUG
        org.springframework.boot.autoconfigure.flyway: DEBUG