version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: monitoring-system-web:latest
    container_name: monitoring-web
    ports:
      - "0.0.0.0:8070:8080"  # 모든 네트워크 인터페이스에서 접속 가능
    env_file:
      - .env
    environment:
      # 데이터베이스 설정 (외부 데이터베이스 사용)
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://172.22.1.113:5432/monitoring}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-monitoring}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-monitoring}
      
      # 애플리케이션 설정
      APP_SYSTEM_NAME: ${APP_SYSTEM_NAME:-CNIT 모니터링시스템}
      
      # Worker API 설정 (다른 서버의 Worker와 통신)
      WORKER_API_BASE_URL: ${WORKER_API_BASE_URL:-http://172.22.2.13:8081}
      WORKER_API_ENABLED: ${WORKER_API_ENABLED:-true}
      WORKER_API_KEY: ${WORKER_API_KEY:-}
      WORKER_API_TIMEOUT_MS: ${WORKER_API_TIMEOUT_MS:-10000}
      
      # Aligo API 설정 (SMS/카카오 알림톡)
      ALIGO_API_KEY: ${ALIGO_API_KEY:-}
      ALIGO_USER_ID: ${ALIGO_USER_ID:-}
      ALIGO_SENDER: ${ALIGO_SENDER:-}
      ALIGO_SENDER_KEY: ${ALIGO_SENDER_KEY:-}
      ALIGO_TEMPLATE_CODE: ${ALIGO_TEMPLATE_CODE:-}
      ALIGO_TEST_MODE: ${ALIGO_TEST_MODE:-N}
      
      # 로깅 레벨
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:-INFO}
      LOGGING_LEVEL_ORG_THYMELEAF: ${LOGGING_LEVEL_ORG_THYMELEAF:-INFO}
      LOGGING_LEVEL_COM_EXAMPLE_MONITORING: ${LOGGING_LEVEL_COM_EXAMPLE_MONITORING:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
