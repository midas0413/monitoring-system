# Gmail 이메일 발송 설정 예시
# 이 파일을 application-local.yml 로 복사 후 실제 값으로 수정
# 또는 환경변수: SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
#
# Gmail 앱 비밀번호 발급:
# 1. Google 계정 2단계 인증 활성화
# 2. https://myaccount.google.com/apppasswords 에서 16자리 앱 비밀번호 생성

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: "xxxx xxxx xxxx xxxx"   # 앱 비밀번호 (공백 포함 16자리)
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
