spring:
  main:
    web-application-type: none  # 웹 서버 미기동 (Worker 전용)
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:cnit52940@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:Cnit52940*}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://172.22.1.113:5432/monitoring}
    username: ${SPRING_DATASOURCE_USERNAME:monitoring}
    password: ${SPRING_DATASOURCE_PASSWORD:monitoring}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true  # 기존 스키마가 있을 때 baseline 설정
    validate-on-migrate: false  # 마이그레이션 파일 변경 시 체크섬 불일치 허용

worker:
  id: ${WORKER_ID:}  # 설정하지 않으면 자동 생성 (호스트명-UUID 형식)
  claim-limit: ${WORKER_CLAIM_LIMIT:10}
  lock-seconds: ${WORKER_LOCK_SECONDS:30}
  loop-sleep-ms: ${WORKER_LOOP_SLEEP_MS:1000}

  sql-timeout-ms: 3000
  ssh-connect-timeout-ms: 5000
  ssh-command-timeout-ms: 15000

  outbox-claim-limit: 50
  outbox-tick-ms: 1000

  alert:
    sender-delay-ms: 1000
    sender-batch-size: 50

    # 규칙 수신자(B)가 비어있으면 여기(C)로 발송
    default-sms-recipients:
      - "01053250413"
      - "01099998888"
    default-email-recipients:
      - "hjkim@cnit21.com"
    default-kakao-recipients:
      - "01053250413"

