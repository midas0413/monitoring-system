version: '3.8'

# 프로덕션 환경용 Docker Compose 설정
# 사용법: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  web:
    restart: always
    environment:
      # 프로덕션 환경에서는 더 엄격한 로깅 레벨 사용
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-WARN}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:-WARN}
      LOGGING_LEVEL_ORG_THYMELEAF: ${LOGGING_LEVEL_ORG_THYMELEAF:-WARN}
    # 리소스 제한 설정 (선택사항)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  worker:
    restart: always
    environment:
      # 프로덕션 환경에서는 더 엄격한 로깅 레벨 사용
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-WARN}
    # 리소스 제한 설정 (선택사항)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # 여러 worker 실행: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale worker=3

  postgres:
    restart: always
    # 리소스 제한 설정 (선택사항)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
